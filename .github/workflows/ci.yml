name: Telecom QoS Anomaly Detection CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated API Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements-api.txt"

      - name: Install CPU PyTorch
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Dependencies
        run: |
          pip install -r requirements-api.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

  docker-build:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t telecom-qos-api:latest -f docker/Dockerfile .

      - name: Run Container & Verify Health Endpoint
        run: |
          docker run -d --name telecom-api-container -p 8000:8000 telecom-qos-api:latest
          echo "Waiting 8 seconds for Uvicorn startup and ResNet-18 model loading..."
          sleep 8
          docker logs telecom-api-container
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health || exit 1
          echo "Container health check passed successfully!"
          docker stop telecom-api-container
          docker rm telecom-api-container
